[build-system]
requires = ["setuptools>=61,<68"]
build-backend = "setuptools.build_meta"

[project]
name = "dingtalk-ears"
version = "0.3.1"
description = "Local DingTalk inbox with Codex summaries and reviewed replies"
readme = "README.md"
requires-python = ">=3.7"
dependencies = []

[project.scripts]
dingtalk-ears = "backend.cli:main"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
backend = ["static/*.html", "static/*.css", "static/*.js", "schema.sql"]

[tool.black]
target-version = ["py37"]
line-length = 100

[tool.ruff]
target-version = "py37"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
