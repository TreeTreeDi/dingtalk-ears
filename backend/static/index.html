<!doctype html>
<html lang="zh-CN" data-theme="kargul">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>钉钉消息助手</title>
    <script nonce="__TOKEN__">
      try {
        var t = localStorage.getItem('dte-panel-theme');
        if (/^(kargul|dark|paper|mono|lilac)$/.test(t)) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="/panel.css" />
  </head>
  <body>
    <div class="app">
      <header class="bar">
        <div class="brand">消息助手</div>
        <div class="bar-end">
          <div id="status" class="status" data-state="starting" role="status">
            <span class="dot" aria-hidden="true"></span><span id="listening">连接中</span
            ><span class="sep" aria-hidden="true">·</span><span id="agent-label">AI 助手</span>
            <span id="agent">连接中</span>
          </div>
          <div id="themes" class="themes" role="group" aria-label="主题">
            <button type="button" data-theme-pick="kargul" aria-label="浅色" title="浅色"></button
            ><button type="button" data-theme-pick="dark" aria-label="深色" title="深色"></button
            ><button type="button" data-theme-pick="paper" aria-label="纸本" title="纸本"></button
            ><button type="button" data-theme-pick="mono" aria-label="等宽" title="等宽"></button
            ><button type="button" data-theme-pick="lilac" aria-label="淡紫" title="淡紫"></button>
          </div>
          <a
            href="https://github.com/shiqiWang0/dingtalk-ears"
            target="_blank"
            rel="noopener noreferrer"
            class="icon github-link"
            title="GitHub 仓库"
            aria-label="GitHub 仓库"
          >
            <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true">
              <path
                d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
              ></path>
            </svg>
          </a>
        </div>
      </header>
      <main class="list">
        <div class="list-head">
          <h1>待处理</h1>
          <span class="count" data-n="0"><span id="pending">0</span> 待审</span>
          <nav id="tabs" class="segmented" aria-label="消息来源">
            <button data-filter="all" class="active" aria-pressed="true">全部</button
            ><button data-filter="direct" aria-pressed="false">单聊</button
            ><button data-filter="at" aria-pressed="false">@我</button
            ><button data-filter="groups" aria-pressed="false">关注群</button>
          </nav>
        </div>
        <div id="error" role="alert" hidden></div>
        <div id="messages">
          <div class="skeleton" aria-hidden="true">
            <article>
              <span class="sk-time"></span>
              <div>
                <span class="sk-line short"></span><span class="sk-line"></span
                ><span class="sk-block"></span>
              </div>
            </article>
            <article>
              <span class="sk-time"></span>
              <div>
                <span class="sk-line short"></span><span class="sk-line"></span
                ><span class="sk-block"></span>
              </div>
            </article>
            <article>
              <span class="sk-time"></span>
              <div><span class="sk-line short"></span><span class="sk-line mid"></span></div>
            </article>
          </div>
        </div>
      </main>
      <aside class="rail">
        <section class="section overview">
          <div class="section-head">
            <h2>总结</h2>
            <button
              id="refresh-overview"
              class="icon"
              type="button"
              aria-label="重新总结"
              title="重新总结"
            >
              <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                <path
                  d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
          <div id="overview-text" class="overview-text">
            <span class="sk-line"></span><span class="sk-line"></span
            ><span class="sk-line short"></span>
          </div>
          <p id="overview-note" class="meta-line"></p>
        </section>
        <section class="section todos">
          <div class="section-head">
            <h2>待办 <span id="todo-count" class="count">0</span></h2>
          </div>
          <div id="todo-list"></div>
        </section>
        <section class="section groups">
          <div class="section-head">
            <h2>关注群</h2>
            <button
              id="add-group"
              class="icon"
              type="button"
              aria-label="添加关注群"
              title="添加关注群"
            >
              <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                <path
                  d="M8 3v10M3 8h10"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                />
              </svg>
            </button>
          </div>
          <div id="group-list"></div>
          <p class="meta-line">添加或删除会保存到本机配置；重启服务后开始或停止监听。</p>
        </section>
        <section class="section foot">
          <div class="section-head"><h2>实时接收</h2></div>
          <dl id="listener-note" class="kv">
            <div>
              <dt>单聊</dt>
              <dd><span class="sk-line tiny"></span></dd>
            </div>
            <div>
              <dt>@我</dt>
              <dd><span class="sk-line tiny"></span></dd>
            </div>
            <div>
              <dt>关注群</dt>
              <dd><span class="sk-line tiny"></span></dd>
            </div>
          </dl>
          <dl class="kv">
            <div>
              <dt>更新</dt>
              <dd id="updated">读取中</dd>
            </div>
          </dl>
        </section>
      </aside>
    </div>
    <dialog id="todo-dialog" aria-labelledby="todo-dialog-title">
      <form id="todo-form">
        <h2 id="todo-dialog-title">添加到钉钉待办</h2>
        <label for="todo-title" class="visually-hidden">待办标题</label
        ><input
          id="todo-title"
          name="title"
          maxlength="200"
          required
          autocomplete="off"
          placeholder="待办标题"
        />
        <p id="todo-dialog-error" class="dialog-error" role="alert"></p>
        <div class="actions">
          <button type="button" id="todo-cancel">取消</button
          ><button type="submit" id="todo-submit" class="primary">添加</button>
        </div>
      </form>
    </dialog>
    <dialog id="group-dialog" aria-labelledby="group-dialog-title">
      <form id="group-form">
        <h2 id="group-dialog-title">添加关注群</h2>
        <label for="group-search" class="visually-hidden">选择群</label>
        <div class="group-combobox">
          <div id="group-selection" class="group-selection"></div>
          <input
            id="group-search"
            autocomplete="off"
            role="combobox"
            aria-autocomplete="list"
            aria-controls="group-options"
            aria-expanded="false"
            placeholder="输入群名称搜索"
          />
          <ul id="group-options" class="group-options" role="listbox" hidden></ul>
        </div>
        <p id="group-dialog-error" class="dialog-error" role="alert"></p>
        <div class="actions">
          <button type="button" id="group-cancel">取消</button
          ><button type="submit" class="primary">保存关注群</button>
        </div>
      </form>
    </dialog>
    <script nonce="__TOKEN__" src="/panel.js"></script>
  </body>
</html>
